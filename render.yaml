services:
  - type: web
    name: drugonaut-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DRUGONAUT_FRONTEND_URL
        value: https://drugonaut-web.onrender.com

  - type: web
    name: drugonaut-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://drugonaut-api.onrender.com
